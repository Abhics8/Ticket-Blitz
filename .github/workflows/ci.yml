name: Ticket-Blitz CI

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: ticket_blitz
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    env:
      DATABASE_URL: 'postgresql://user:password@localhost:5432/ticket_blitz'
      REDIS_URL: 'redis://localhost:6379'

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Prisma generate
        run: npx prisma generate

      - name: Lint
        run: npx eslint . || true
        continue-on-error: true

      - name: Type check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npx jest --coverage

      - name: Docker build (image)
        run: docker build -t ticket-blitz:test .

  load-test-config:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate k6 scripts are present
        run: |
          for f in load/race.js load/throughput.js; do
            [ -f "$f" ] || { echo "missing $f"; exit 1; }
          done
          echo "✅ k6 load scripts present (run via 'npm run test:race' against a live stack)."
